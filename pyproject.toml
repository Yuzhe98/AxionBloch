[build-system]
requires = [
    "setuptools>=77",
    "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "axionbloch"
version = "0.2.3"
description = "Simulation tool for axion-induced spin dynamics."

authors = [
    { name = "Yuzhe Zhang", email = "yuhzhang@uni-mainz.de" }
]

readme = "README.md"

license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib",
    "astropy",
    "scipy",
    "h5py",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Documentation = "https://axionbloch.readthedocs.io/en/latest/"
Source = "https://github.com/Yuzhe98/AxionBloch"

[tool.setuptools]
zip-safe = false

[tool.setuptools.package-data]
axionbloch = ["data/**/*"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"

[tool.cibuildwheel.linux]
before-all = "yum install -y libgomp || apt-get install -y libgomp1 || true"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]